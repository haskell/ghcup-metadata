      viPreInstall: |
        !! This is an unofficial backport release of 9.6.7 !!
        !! USE AT YOUR OWN RISK                            !!

        Cut from branch: https://gitlab.haskell.org/luite/ghc/-/commits/ghc-9.6-backports
        Release pipeline: https://gitlab.haskell.org/luite/ghc/-/pipelines/133356

        Summary of patches backported:
          * TimerManager: publish only evaluated timeout queues (#9809)
          * Use specific clang assembler when compiling with -fllvm
          * Expand LLVM version matching regex for compability with bsd systems
          * Use x86_64-unknown-windows-gnu target for LLVM on Windows
          * Use the bundled LLVM tools on Windows
          * Bump hsc2hs submodule to 0.68.10
          * LLVM: use -relocation-model=pic on Windows

